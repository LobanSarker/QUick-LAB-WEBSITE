backend:
  name: git-gateway
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: blogs
    label: Blog Posts
    description: Blog posts shown on /blog. Saved changes commit to the repo and trigger a rebuild.
    folder: lib/data/blogs
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - {
          label: Slug,
          name: slug,
          widget: string,
          hint: "URL identifier (lowercase, hyphens). Leave blank to auto-generate from the title.",
          required: false,
        }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Cover Image, name: cover, widget: image, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Content, name: content, widget: markdown }
      - {
          label: Status,
          name: status,
          widget: select,
          options: [PUBLISHED, DRAFT],
          default: DRAFT,
        }
      - {
          label: Publish Date,
          name: createdAt,
          widget: date,
          format: YYYY-MM-DD,
          default: "{{now}}",
        }
      - {
          label: Author,
          name: authorName,
          widget: string,
          default: Sumaiya Tabassum,
        }

  - name: people
    label: People
    description: Lab members shown on /people, grouped by role.
    folder: lib/data/people
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{name}}"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Institution, name: institution, widget: string }
      - {
          label: Role,
          name: role,
          widget: string,
          required: false,
          hint: "e.g. Director, Honorary Advisor, Undergraduate Research Assistant",
        }
      - {
          label: Profile URL,
          name: profileUrl,
          widget: string,
          required: false,
          hint: "LinkedIn or other profile link",
        }
      - {
          label: Sort Order,
          name: sortOrder,
          widget: number,
          default: 0,
          hint: "Lower numbers appear first",
        }

  - name: publications
    label: Publications
    description: Papers shown on /publications, filterable by year.
    folder: lib/data/publications
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{title}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Venue, name: venue, widget: string }
      - { label: Year, name: year, widget: number, value_type: int }
      - { label: Authors, name: authors, widget: list, required: false }
      - { label: Abstract, name: abstract, widget: text, required: false }
      - { label: DOI, name: doi, widget: string, required: false }
      - {
          label: Paper Link,
          name: link,
          widget: string,
          required: false,
          default: "https://mailmissouri-my.sharepoint.com/:f:/g/personal/snvb8_umsystem_edu/EkPJqOYjRJVPgLMnKJLLRDoBbRASCxuFMz4qprB1e2KC_g?e=kfQpbN",
        }
      - { label: Cover Image, name: image, widget: image, required: false }
